services:
  - type: web
    name: sunflower-market-pro
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sunflower-market-db
          property: connectionString

databases:
  - name: sunflower-market-db
    plan: free
